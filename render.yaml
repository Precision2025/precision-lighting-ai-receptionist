services:
  - type: web
    name: precision-lighting-receptionist
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: LIVE_TRANSFER_NUMBER
        value: +12142435649
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"
